name: Tests

on:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        pest: ['^2.0', '^3.0']

    name: PHP ${{ matrix.php }} - Pest ${{ matrix.pest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-pest-${{ matrix.pest }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-pest-${{ matrix.pest }}-
            ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install main package dependencies
        run: |
          composer require pestphp/pest:${{ matrix.pest }} --dev --no-update
          composer update --prefer-dist --no-progress

      - name: Run unit tests
        run: ./vendor/bin/pest --colors=always

      - name: Update Pest version in example
        working-directory: example
        run: |
          composer require pestphp/pest:${{ matrix.pest }} --dev --no-update
          composer update --prefer-dist --no-progress

      - name: Run tests
        working-directory: example
        run: ./vendor/bin/pest --colors=always

  integration-test:
    runs-on: ubuntu-latest
    needs: tests
    name: Integration Test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, json, fileinfo
          coverage: none

      - name: Install main package dependencies
        run: composer update --prefer-dist --no-progress

      - name: Install example dependencies
        working-directory: example
        run: composer update --prefer-dist --no-progress

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reporters-validator
        run: pip install git+https://github.com/qase-tms/reporters-validator.git

      - name: Download report schemas
        run: git clone --depth 1 https://github.com/qase-tms/specs.git /tmp/specs

      - name: Validate Pest reporter
        working-directory: example
        run: |
          QASE_MODE=report \
          QASE_REPORT_CONNECTION_PATH=${{ github.workspace }}/build/report \
          ./vendor/bin/pest --colors=always || true

          reporters-validator validate \
            --report-dir ${{ github.workspace }}/build/report \
            --expected ${{ github.workspace }}/expected/pest-examples.yaml \
            --schema-dir /tmp/specs/report/schemas

  code-style:
    runs-on: ubuntu-latest
    name: Code Style

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check PHP syntax
        run: find src -name "*.php" -print0 | xargs -0 -n1 php -l

  static-analysis:
    runs-on: ubuntu-latest
    name: Static Analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: |
          composer require --dev phpstan/phpstan --no-progress
          vendor/bin/phpstan analyse src --level=5 --no-progress || true
