name: Tests

on:
  push:
    branches: [main, feature/*]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        pest: ['^2.0', '^3.0']

    name: PHP ${{ matrix.php }} - Pest ${{ matrix.pest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-pest-${{ matrix.pest }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-pest-${{ matrix.pest }}-
            ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install main package dependencies
        run: composer install --prefer-dist --no-progress

      - name: Update Pest version in example
        working-directory: example
        run: |
          composer require pestphp/pest:${{ matrix.pest }} --dev --no-update
          composer update --prefer-dist --no-progress

      - name: Run tests
        working-directory: example
        run: ./vendor/bin/pest --colors=always

  code-style:
    runs-on: ubuntu-latest
    name: Code Style

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check PHP syntax
        run: find src -name "*.php" -print0 | xargs -0 -n1 php -l

  static-analysis:
    runs-on: ubuntu-latest
    name: Static Analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: |
          composer require --dev phpstan/phpstan --no-progress
          vendor/bin/phpstan analyse src --level=5 --no-progress || true
